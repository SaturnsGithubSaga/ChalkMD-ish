<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChalkMD-ish</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
    <style>
        body { font-family: monospace; display: flex; height: 100vh; margin: 0; background: #1e1e1e; color: #d4d4d4; }
        #sidebar { width: 300px; border-right: 1px solid #333; padding: 10px; overflow-y: auto; }
        #editor { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        .CodeMirror { flex: 1; height: auto; font-family: monospace; font-size: 14px; border: 1px solid #333; }
        .cm-header-1 { font-size: 1.4em; font-weight: bold; color: #569cd6 !important; }
        .cm-header-2 { font-size: 1.3em; font-weight: bold; color: #4ec9b0 !important; }
        .cm-header-3 { font-size: 1.2em; font-weight: bold; color: #dcdcaa !important; }
        .cm-header-4, .cm-header-5, .cm-header-6 { font-weight: bold; color: #ce9178 !important; }
        button { background: #0e639c; color: white; border: none; padding: 8px 15px; cursor: pointer; margin-bottom: 10px; width: 100%; }
        button:hover { background: #1177bb; }
        ul { list-style: none; padding-left: 15px; margin: 2px 0; }
        li { margin: 4px 0; cursor: pointer; }
        li.file:hover { color: #4ec9b0; }
        li.folder > span { font-weight: bold; color: #dcdcaa; }
    </style>
</head>
<body>
    <div id="sidebar">
        <button id="openDir">Open Vault Folder</button>
        <div id="fileTree"></div>
    </div>
    <div id="editor">
        <div id="currentFile" style="margin-bottom: 10px; color: #858585;">No file selected</div>
        <textarea id="content"></textarea>
    </div>

    <script>
        let currentFileHandle = null;
        let rootDirHandle = null;
        let isSaving = false;

        const editor = CodeMirror.fromTextArea(document.getElementById('content'), {
            mode: 'markdown',
            theme: 'material-darker',
            lineNumbers: true,
            lineWrapping: true
        });

        const openBtn = document.getElementById('openDir');

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const handle = await getStoredHandle();
                if (handle && (await verifyPermission(handle, false))) {
                    rootDirHandle = handle;
                    openBtn.textContent = 'Change Vault Folder';
                    await loadTree(rootDirHandle);
                }
            } catch (err) {
                console.log('No prior folder loaded automatically.');
            }
        });

        openBtn.addEventListener('click', async () => {
            try {
                rootDirHandle = await window.showDirectoryPicker();
                await storeHandle(rootDirHandle);
                openBtn.textContent = 'Change Vault Folder';
                await loadTree(rootDirHandle);
            } catch (err) {
                console.error(err);
            }
        });

        async function loadTree(dirHandle) {
            const treeContainer = document.getElementById('fileTree');
            treeContainer.innerHTML = '';
            const ul = document.createElement('ul');
            await buildTree(dirHandle, ul);
            treeContainer.appendChild(ul);
        }

        async function buildTree(dirHandle, parentElement) {
            const entries = [];
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'directory' || (entry.kind === 'file' && entry.name.endsWith('.md'))) {
                    entries.push(entry);
                }
            }

            entries.sort((a, b) => {
                if (a.kind === b.kind) {
                    return a.name.localeCompare(b.name, undefined, { sensitivity: 'accent', numeric: true });
                }
                return a.kind === 'directory' ? -1 : 1;
            });

            for (const entry of entries) {
                const li = document.createElement('li');
                if (entry.kind === 'directory') {
                    li.className = 'folder';
                    const span = document.createElement('span');
                    span.textContent = '📁 ' + entry.name;
                    const subUl = document.createElement('ul');
                    subUl.style.display = 'none';
                    span.addEventListener('click', (e) => {
                        e.stopPropagation();
                        subUl.style.display = subUl.style.display === 'none' ? 'block' : 'none';
                    });
                    li.appendChild(span);
                    li.appendChild(subUl);
                    await buildTree(entry, subUl);
                } else {
                    li.className = 'file';
                    li.textContent = '📄 ' + entry.name;
                    li.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        currentFileHandle = entry;
                        const file = await entry.getFile();
                        editor.setValue(await file.text());
                        document.getElementById('currentFile').textContent = entry.name;
                    });
                }
                parentElement.appendChild(li);
            }
        }

        editor.on('change', async () => {
            if (!currentFileHandle || isSaving) return;
            isSaving = true;
            try {
                const writable = await currentFileHandle.createWritable();
                await writable.write(editor.getValue());
                await writable.close();
            } catch (err) {
                console.error('Save failed:', err);
            } finally {
                isSaving = false;
            }
        });

        function getDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('WebVaultDB', 1);
                request.onupgradeneeded = e => e.target.result.createObjectStore('handles');
                request.onsuccess = e => resolve(e.target.result);
                request.onerror = e => reject(e.target.error);
            });
        }

        async function storeHandle(handle) {
            const db = await getDB();
            const tx = db.transaction('handles', 'readwrite');
            tx.objectStore('handles').put(handle, 'rootVault');
        }

        async function getStoredHandle() {
            const db = await getDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('handles', 'readonly');
                const req = tx.objectStore('handles').get('rootVault');
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.result);
            });
        }

        async function verifyPermission(fileHandle, readWrite) {
            const options = {};
            if (readWrite) options.mode = 'readwrite';
            if ((await fileHandle.queryPermission(options)) === 'granted') return true;
            if ((await fileHandle.requestPermission(options)) === 'granted') return true;
            return false;
        }
    </script>
</body>
</html>
